/* Layout obrolan bergaya asisten modern: sederhana, lega, tetap monokrom */
.app{max-width:960px;padding-left:clamp(12px,3vw,28px);padding-right:clamp(12px,3vw,28px);gap:8px}
header{background:rgba(4,4,4,.82);border:1px solid rgba(255,255,255,.10);box-shadow:none;border-radius:16px;min-height:50px;padding:5px 8px 5px 14px}
#chat{width:100%;max-width:790px;margin:0 auto;gap:24px;padding:18px 2px 26px;scroll-padding-bottom:24px}
.row{width:100%;max-width:790px;margin:0 auto;gap:0}
.row.user{justify-content:flex-end}
.row.bot{justify-content:flex-start}
.bubble{max-width:100%;min-width:0;padding:0;border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;line-height:1.72;font-size:1rem;white-space:pre-wrap;overflow-wrap:anywhere}
.row.user .bubble{max-width:min(82%,600px);padding:10px 15px;background:#252525!important;border:1px solid rgba(255,255,255,.075)!important;border-radius:22px!important;color:#fff;line-height:1.55}
.row.bot .bubble{width:100%;max-width:100%;padding:0 2px;color:#f4f4f4}
.row.bot .bubble.thinking{width:auto;min-width:72px;padding:10px 15px;border:1px solid var(--edge)!important;border-radius:16px!important;background:#171717!important}
.row.user .bubble:has(.sent-attachments){max-width:min(90%,650px);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row.user .bubble:has(.sent-attachments) .message-text{flex:1 1 100%;min-width:0}
.message-actions{justify-content:flex-start;margin-top:12px}
.message-action{background:transparent;border-color:transparent;border-radius:8px;padding:6px 8px}
.message-action:hover{background:rgba(255,255,255,.09);border-color:var(--edge)}
.source-list{margin-top:18px}
.composer-wrap{width:100%;max-width:790px;margin:0 auto;padding-top:4px}
form{gap:9px;padding:9px 10px 9px 15px;border-radius:26px;background:#171717;border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 26px rgba(0,0,0,.28)}
form:focus-within{background:#191919;border-color:rgba(255,255,255,.28);box-shadow:0 0 0 1px rgba(255,255,255,.04),0 8px 28px rgba(0,0,0,.25)}
textarea{padding:7px 0;max-height:180px}
.upload-tools{margin-bottom:5px}
#kirim{width:38px;height:38px;box-shadow:none}
.composer-hint{margin-top:8px;margin-bottom:0;font-size:.7rem}
body.ada-chat .hero{display:none}
/* Composer: lampiran, input, dan kirim berada dalam satu kolom/komponen */
.composer-form{display:flex;flex-direction:column;align-items:stretch;gap:0;width:100%;max-width:790px;margin:0 auto;padding:8px;border-radius:26px;background:#171717;border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 26px rgba(0,0,0,.28)}
.composer-form:focus-within{background:#191919;border-color:rgba(255,255,255,.28);box-shadow:0 0 0 1px rgba(255,255,255,.04),0 8px 28px rgba(0,0,0,.25)}
.composer-files{display:flex;align-items:flex-start;gap:8px;padding:2px 4px 9px;min-width:0;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:5px}
.composer-files[hidden]{display:none}
.composer-files .attachments{max-height:100px;min-width:0;flex:1;display:flex;flex-wrap:wrap;gap:7px}
.composer-files .upload-note{font-size:.65rem;margin-left:auto;padding-top:5px;white-space:nowrap}
.composer-entry{display:flex;align-items:flex-end;gap:9px;min-width:0;width:100%}
.composer-entry .attach-btn{width:38px;height:38px;margin-bottom:1px;background:transparent;border-color:transparent;color:#d4d4d4}
.composer-entry .attach-btn:hover{background:rgba(255,255,255,.09);border-color:var(--edge)}
.composer-entry textarea{min-width:0;max-height:180px;min-height:38px;align-self:flex-end;padding:8px 0;line-height:1.45}
.composer-entry #kirim{width:38px;height:38px;margin-bottom:1px}
/* Jawaban bot: hirarki teks, jarak, tabel, dan kode lebih konsisten */
.row.bot .bubble{font-size:1rem;line-height:1.75;letter-spacing:.002em;color:#f2f2f2}
.row.bot .bubble strong{font-weight:700;color:#fff}
.row.bot .bubble a{color:#f4f4f4;text-decoration:underline;text-decoration-color:rgba(255,255,255,.45);text-underline-offset:3px;overflow-wrap:anywhere}
.row.bot .bubble .code-block{margin:14px 0;border-radius:14px}
.row.bot .bubble .source-list{margin:16px 0 6px}
.row.bot .bubble .file-card{margin:14px 0}
.row.bot .bubble .message-actions{padding-top:2px}

.row.bot .bubble .md-list-item{display:block;padding-left:2px;margin:3px 0;line-height:1.65}
.row.bot .bubble .md-list-item .md-bullet{display:inline-block;width:1.2em;color:#aaa}
.row.user .bubble:has(.sent-attachments){gap:10px;align-items:flex-start}
.row.user .bubble:has(.sent-attachments) .message-text{flex:1 1 100%;line-height:1.5}
.row.user .bubble:has(.sent-attachments) .sent-attachments{flex:1 1 100%;display:flex;align-items:flex-start;gap:9px}
.sent-file{width:min(280px,100%)}

 const payload={title:s.title||'Obrolan AQIZ ai',messages:s.messages.map(m=>({role:m.role,parts:(m.parts||[]).map(p=>({text:p.text||''}))}))};
 const url=new URL(location.href);url.hash='share='+toBase64Url(JSON.stringify(payload));
 // Tautan berbasis halaman ini; penerima harus dapat membuka halaman yang sama secara online.
 if(url.href.length>60000){await salinTeks(transkrip(s));beriTahu('Obrolan terlalu panjang untuk tautan. Transkrip disalin.');return}
 try{if(navigator.share){await navigator.share({title:payload.title,text:'Obrolan dari AQIZ ai',url:url.href});return}}catch(e){if(e?.name==='AbortError')return}
 const ok=await salinTeks(url.href);beriTahu(ok?'Tautan obrolan disalin.':'Salin tautan dari dialog yang muncul.')
}

 }catch(_){beriTahu('Tautan obrolan tidak valid atau rusak.')}
}

async function tampilkanJawaban(el,teks,masihAktif){el.classList.remove('thinking');el.classList.add('answer-enter');if(GERAK_KURANG||teks.length>5500){el.innerHTML=format(teks);pastikanAksiJawaban(el);ikutiBawahJikaPerlu();return}el.textContent='';const n=teks.length,langkah=n>2200?20:n>900?11:n>250?5:2,jeda=n>1800?7:n>700?10:14;for(let i=0;i<n;i+=langkah){if(!masihAktif())return;el.textContent=teks.slice(0,Math.min(i+langkah,n));ikutiBawahJikaPerlu();await tunggu(jeda)}if(!masihAktif())return;el.innerHTML=format(teks);pastikanAksiJawaban(el);el.classList.add('answer-enter');ikutiBawahJikaPerlu()}
function bersihModel(t){return String(t||'').replace(/\[\[AQIZ_SOURCES\]\][\s\S]*?\[\[\/AQIZ_SOURCES\]\]/g,'').replace(/\n*Pencarian web tidak mengembalikan tautan sumber[^\n]*/gi,'').replace(/\n*\[Lampiran file\]/g,'').trim()}
const RE_MINTA_SUMBER=/sumber|link|tautan|url|referensi|source|jurnal|dari mana|situs|website|berita|artikel|video|youtube|buktikan|asli/i;
async function panggil(model,requestRiwayatAsli,pakaiSearch=true,ulang=false){
 // Bersihkan blok sumber/URL redirect dari riwayat agar model tidak bingung, lalu paksa pencarian bila pengguna meminta sumber.
 let requestRiwayat=requestRiwayatAsli.map(m=>({role:m.role,parts:(m.parts||[]).map(p=>(typeof p.text==='string')?{text:m.role==='model'?bersihModel(p.text):p.text}:p)}));
 const terakhirTeks=String(requestRiwayat[requestRiwayat.length-1]?.parts?.[0]?.text||'');
 const mintaSumber=pakaiSearch&&RE_MINTA_SUMBER.test(terakhirTeks);
 if(mintaSumber){const idx=requestRiwayat.length-1,p0=requestRiwayat[idx].parts[0];let topik='';for(let i=idx-1;i>=0;i--){if(requestRiwayat[i].role==='user'){topik=String(requestRiwayat[i].parts?.[0]?.text||'').slice(0,300);break}}requestRiwayat[idx]={role:'user',parts:[{text:p0.text+'\n\n[Instruksi sistem: pengguna meminta sumber/tautan. WAJIB jalankan Google Search sekarang (jangan hanya mengandalkan jawaban sebelumnya)'+(topik?' untuk topik: "'+topik.replace(/"/g,"'")+'"':'')+(ulang?'. Cari dengan kata kunci yang berbeda dan spesifik':'')+'. Jawab ringkas dan sebutkan nama sumber yang benar-benar ditemukan; tautan akan ditampilkan otomatis sebagai kartu.]'},...requestRiwayat[idx].parts.slice(1)]}}
 const url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent';
 const mode=document.getElementById('modeAQIZ')?.value||'Umum';const modeInstruksi=({Riset:'Mode Riset: cari sumber nyata, prioritaskan situs resmi, artikel ilmiah, dan dokumentasi primer. Pisahkan fakta, interpretasi, dan ketidakpastian.',Coding:'Mode Coding: berikan solusi kode yang dapat dijalankan, jelaskan lokasi perubahan, dan hindari menghapus fungsi lama yang tidak diminta.',Akademik:'Mode Akademik: gunakan bahasa formal, struktur logis, dan jangan mengarang kutipan atau daftar pustaka.',Ringkasan:'Mode Ringkasan: utamakan inti informasi, ringkas dan terstruktur tanpa menghilangkan poin penting.',Penulisan:'Mode Penulisan: hasilkan tulisan siap pakai sesuai tujuan dan gaya yang diminta.'})[mode]||'';const body={system_instruction:{parts:[{text:PETUNJUK+'\n\n'+modeInstruksi+(window.AQIZ_SUARA_AKTIF?'\n\nMODE SUARA AKTIF: Pengguna berbicara lewat suara dan jawabanmu akan DIBACAKAN dengan suara. Jawab singkat, natural, dan santai seperti mengobrol (maksimal 2 kalimat pendek kecuali diminta detail). Jangan gunakan tabel, emoji, markdown berat, atau daftar panjang.':'')}]},contents:requestRiwayat};if(pakaiSearch)body.tools=[{google_search:{}}];
 const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':API_KEY},body:JSON.stringify(body)});const data=await res.json().catch(()=>({}));
 if(!res.ok){const err=Error(data.error?.message||('HTTP '+res.status));err.status=res.status;err.apiMessage=data.error?.message||'';throw err}
 const kandidat=data.candidates?.[0];let teks=kandidat?.content?.parts?.map(p=>p.text||'').join('');if(!teks){const err=Error('AI tidak memberikan jawaban.');err.status=0;throw err}
 const sumber=[],seen=new Set();for(const c of (kandidat?.groundingMetadata?.groundingChunks||[])){const w=c?.web;if(!w?.uri||!/^https?:\/\//i.test(w.uri)||isSearchResultUrl(w.uri))continue;let uri;try{uri=new URL(w.uri).href}catch(_){continue}if(seen.has(uri))continue;seen.add(uri);const judulW=String(w.title||'').trim();sumber.push({title:judulW||new URL(uri).hostname,uri,host:/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(judulW)?judulW.replace(/^www\./,''):''})}
 if(pakaiSearch&&!sumber.length&&mintaSumber&&!ulang)return panggil(model,requestRiwayatAsli,true,true);
 // Link grounding Gemini berupa redirect (vertexaisearch); coba ambil URL asli, bila diblokir CORS tetap pakai redirect (tetap membuka halaman asli).
 await Promise.all(sumber.map(async x=>{try{if(!/vertexaisearch\.cloud\.google\.com$/i.test(new URL(x.uri).hostname))return;const c=new AbortController(),tm=setTimeout(()=>c.abort(),3500);const r=await fetch(x.uri,{method:'HEAD',redirect:'follow',signal:c.signal});clearTimeout(tm);if(r&&r.url&&!/vertexaisearch\.cloud\.google\.com$/i.test(new URL(r.url).hostname)&&!isSearchResultUrl(r.url)){x.uri=new URL(r.url).href;try{x.host=new URL(x.uri).hostname.replace(/^www\./,'')}catch(_){}}}catch(_){}}));
 // Pertahankan tautan Markdown hanya bila URL persis cocok dengan grounding Google Search.
 const verified=new Set(sumber.map(x=>{try{return new URL(x.uri).href}catch(_){return ''}})),inlineLinks=[];
 teks=teks.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,(_,label,uri)=>{try{const u=new URL(uri);if(pakaiSearch&&verified.has(u.href)&&!isSearchResultUrl(u.href)){const token='AQIZINLINE'+inlineLinks.length+'TOKEN';inlineLinks.push('['+label+']('+u.href+')');return token}return label+' (tautan langsung tidak terverifikasi)'}catch(_){return label+' (tautan tidak valid)'}});
 teks=teks.replace(/https?:\/\/[^\s<>"'`]+/gi,'').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
 teks=teks.replace(/AQIZINLINE(\d+)TOKEN/g,(_,i)=>inlineLinks[Number(i)]||'');
 if(pakaiSearch){if(sumber.length){teks+='\n\n[[AQIZ_SOURCES]]'+JSON.stringify(sumber.slice(0,10))+'[[/AQIZ_SOURCES]]'}else{teks+='\n\nPencarian web tidak mengembalikan tautan sumber yang bisa ditampilkan untuk jawaban ini. Saya tidak akan mengarang URL.'}}
 return teks;
}
async function tanya(requestRiwayat){
 try{return await panggil(MODELS[0],requestRiwayat,(!window.AQIZ_SUARA_AKTIF||/berita|terbaru|terkini|hari ini|harga|cuaca|skor|kurs|sekarang|latest|news|today|price|weather/i.test(String(requestRiwayat[requestRiwayat.length-1]?.parts?.[0]?.text||''))))}catch(errSearch){
  if(errSearch instanceof TypeError)throw Error('Tidak ada koneksi internet. Pencarian sumber dan pembuatan tautan langsung memerlukan koneksi aktif.');
  if(![400,403,404,429].includes(errSearch.status))throw Error(errSearch.apiMessage||errSearch.message||'Permintaan Gemini gagal.');
  try{return await panggil(MODELS[0],requestRiwayat,false)}catch(errBiasa){if(errBiasa instanceof TypeError)throw Error('Tidak ada koneksi internet.');const detail=errBiasa.apiMessage||errBiasa.message||('HTTP '+errBiasa.status);if(errBiasa.status===429)throw Error('API membatasi permintaan. Coba beberapa saat lagi. Detail: '+detail);if(errBiasa.status===403)throw Error('Akses API ditolak. Periksa izin API key dan proyek. Detail: '+detail);throw Error('Permintaan Gemini gagal. '+detail)}
 }
}
function ukuranBerkas(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
function gambarFile(file){return /^image\/(png|jpeg|webp|gif)$/i.test(file.type)||/\.(png|jpe?g|webp|gif)$/i.test(file.name)}
function bacaFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Gagal membaca '+file.name));r.readAsArrayBuffer(file)})}
async function skenarioTeks(file,buffer){const ext=file.name.split('.').pop().toLowerCase();const decoder=new TextDecoder('utf-8');
 if(['txt','md','csv','json'].includes(ext))return decoder.decode(buffer).slice(0,MAX_EXTRACTED_CHARS);
 if(ext==='pdf'){await muatScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',()=>!!window.pdfjsLib);window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(buffer)}).promise;let out='';for(let i=1;i<=Math.min(pdf.numPages,100);i++){const page=await pdf.getPage(i),content=await page.getTextContent();out+='\n[Halaman '+i+']\n'+content.items.map(x=>x.str||'').join(' ');if(out.length>=MAX_EXTRACTED_CHARS)break}return out.slice(0,MAX_EXTRACTED_CHARS)||'[PDF tidak memiliki teks yang bisa diekstrak; mungkin berupa hasil scan.]'}
 if(ext==='docx'){await muatScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js',()=>!!window.mammoth);const result=await window.mammoth.extractRawText({arrayBuffer:buffer});return String(result.value||'').slice(0,MAX_EXTRACTED_CHARS)}
 if(['xlsx','xls'].includes(ext)){await muatScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',()=>!!window.XLSX);const wb=window.XLSX.read(buffer,{type:'array'});return wb.SheetNames.map(name=>'[Sheet: '+name+']\n'+window.XLSX.utils.sheet_to_csv(wb.Sheets[name])).join('\n\n').slice(0,MAX_EXTRACTED_CHARS)}
 if(ext==='pptx'){await muatScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',()=>!!window.JSZip);const zip=await window.JSZip.loadAsync(buffer),names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>Number(a.match(/slide(\d+)/)[1])-Number(b.match(/slide(\d+)/)[1]));let out='';for(let i=0;i<Math.min(names.length,100);i++){const xml=await zip.files[names[i]].async('text'),doc=new DOMParser().parseFromString(xml,'application/xml');out+='\n[Slide '+(i+1)+']\n'+Array.from(doc.getElementsByTagName('a:t')).map(n=>n.textContent).join(' ');if(out.length>=MAX_EXTRACTED_CHARS)break}return out.slice(0,MAX_EXTRACTED_CHARS)}
 throw Error('Format file tidak didukung: '+ext);
}
function renderBerkas(){const box=$('attachments');box.replaceChildren();const filesWrap=$('composerFiles');if(filesWrap)filesWrap.hidden=!berkasDipilih.length;for(const f of berkasDipilih){const chip=document.createElement('div');chip.className='attachment-chip';const label=document.createElement('span');label.textContent=f.name+' · '+ukuranBerkas(f.size);label.title=f.name;const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Hapus '+f.name);remove.onclick=()=>{berkasDipilih=berkasDipilih.filter(x=>x.id!==f.id);renderBerkas()};chip.append(label,remove);box.appendChild(chip)}$('attachBtn').disabled=sibuk}
async function tambahBerkas(files){const incoming=Array.from(files||[]);$('fileInput').value='';for(const file of incoming){if(berkasDipilih.length>=MAX_FILES){beriTahu('Maksimal '+MAX_FILES+' file sekali kirim.');break}if(file.size>MAX_FILE_SIZE){beriTahu(file.name+' terlalu besar (maks. 20 MB).');continue}if(berkasDipilih.some(f=>f.name===file.name&&f.size===file.size)){continue}const ext=file.name.split('.').pop().toLowerCase(),item={id:buatId(),name:file.name,size:file.size,type:file.type,kind:'text',text:'',inlineData:null,mimeType:file.type||'application/octet-stream',status:'loading'};berkasDipilih.push(item);renderBerkas();try{const buffer=await bacaFile(file);if(gambarFile(file)){item.kind='image';item.mimeType=file.type||({'jpg':'image/jpeg','jpeg':'image/jpeg','png':'image/png','webp':'image/webp','gif':'image/gif'}[ext]||file.type);const bytes=new Uint8Array(buffer);let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));item.inlineData=btoa(binary)}else{item.text=await skenarioTeks(file,buffer);if(!item.text.trim())item.text='[Tidak ada teks yang dapat diekstrak dari file ini.]'}item.status='ready';beriTahu('File siap: '+file.name)}catch(e){berkasDipilih=berkasDipilih.filter(x=>x.id!==item.id);beriTahu('Tidak bisa membaca '+file.name+': '+(e.message||'format tidak didukung'));console.error('AQIZ upload error',e)}renderBerkas()}}
$('attachBtn').addEventListener('click',()=>{if(!sibuk)$('fileInput').click()});$('fileInput').addEventListener('change',e=>tambahBerkas(e.target.files));

async function kirimPesan(teks){teks=String(teks||'').trim();if(sibuk||(!teks&&!berkasDipilih.length))return;if(berkasDipilih.some(f=>f.status!=='ready')){beriTahu('Tunggu sampai semua file selesai diproses.');return}const lampiran=berkasDipilih.slice();const catatanLampiran=lampiran.map(f=>'[Lampiran: '+f.name+']'+(f.kind==='text'?'\nIsi file:\n'+f.text:'')).join('\n\n');const teksTersimpan=(teks?teks+'\n\n':'')+catatanLampiran;const partsKirim=[{text:(teks||'Tolong analisis lampiran yang saya kirim.')+'\n\n'+catatanLampiran},...lampiran.filter(f=>f.kind==='image').map(f=>({inline_data:{mime_type:f.mimeType,data:f.inlineData}}))];if(API_KEY.startsWith('ISI_')){gelembung('bot','API key belum diisi.',false).classList.add('error');return}if(!idAktif||!sesiAktif())buatChat();const sesi= sesiAktif();const pesanSesi=sesi.messages||(sesi.messages=[]);riwayat=pesanSesi;sibuk=true;kirim.disabled=true;kirim.classList.add('loading');const req={id:++requestId,sesiId:sesi.id,dibatalkan:false};permintaanAktif=req;chat.dataset.following='true';const previewData={};for(const f of lampiran){if(f.kind==='image'&&f.inlineData)previewData[f.id]='data:'+f.mimeType+';base64,'+f.inlineData}const pesanPengguna={role:'user',parts:[{text:teksTersimpan}],attachments:lampiran.map(f=>({id:f.id,name:f.name,size:f.size,type:f.type,mimeType:f.mimeType,kind:f.kind}))};renderPesanPengguna(pesanPengguna,true);riwayat.push(pesanPengguna);simpanPesanUntuk(sesi,riwayat);berkasDipilih=[];renderBerkas();input.value='';ukurInput();const tungguEl=gelembung('bot','<span class="titik"><span></span><span></span><span></span></span>',true);tungguEl.classList.add('thinking');const snapshot=riwayat.map(m=>({role:m.role,parts:(m.parts||[]).map(p=>({text:p.text||''}))}));if(snapshot.length&&snapshot[snapshot.length-1].role==='user')snapshot[snapshot.length-1].parts=partsKirim;const masihAktif=()=>!req.dibatalkan&&permintaanAktif===req&&daftarChat.some(s=>s.id===req.sesiId);try{const jawaban=await tanya(snapshot);if(!masihAktif())return;riwayat.push({role:'model',parts:[{text:jawaban}]});simpanPesanUntuk(sesi,riwayat);if(idAktif===req.sesiId){await tampilkanJawaban(tungguEl,jawaban,masihAktif)}}catch(err){if(!masihAktif())return;const terakhir=riwayat[riwayat.length-1];if(terakhir?.role==='user')riwayat.pop();simpanPesanUntuk(sesi,riwayat);if(idAktif===req.sesiId){tungguEl.classList.remove('thinking');tungguEl.classList.add('error');tungguEl.textContent='Gagal: '+(err instanceof TypeError?'Tidak ada koneksi internet.':err.message)}}finally{if(permintaanAktif===req){permintaanAktif=null;sibuk=false;kirim.classList.remove('loading');renderBerkas();ukurInput()}}}
form.addEventListener('submit',e=>{e.preventDefault();kirimPesan(input.value)});input.addEventListener('input',ukurInput);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!sibuk&&(input.value.trim()||berkasDipilih.length))form.requestSubmit()}});chat.addEventListener('click',e=>{const chip=e.target.closest('.chip');if(chip)kirimPesan(chip.textContent.trim())});$('openHistory').addEventListener('click',bukaPanel);$('closeHistory').addEventListener('click',tutupPanel);$('historyBackdrop').addEventListener('click',tutupPanel);$('newChat').addEventListener('click',obrolanBaru);$('hapus').addEventListener('click',obrolanBaru);$('shareChat').addEventListener('click',()=>bagikanSesi(sesiAktif()));document.addEventListener('keydown',e=>{if(e.key==='Escape')tutupPanel()});

async function dekodeAudio(a){

async function ambilAudioGemini(teks,my){

  let a8=u;if(sisa.length){a8=new Uint8Array(sisa.length+u.length);a8.set(sisa);a8.set(u,sisa.length)}

const BUTUH_CARI=/sumber|link|tautan|referensi|jurnal|berita|terbaru|terkini|hari ini|harga|cuaca|skor|kurs|sekarang|latest|news|today|price|weather/i;

function potongKalimatStream(full,idx,akhir,nKirim){
 const out=[];
 while(true){
  const sisa=full.slice(idx);
  const awal=(nKirim+out.length)===0;
  const min=awal?16:60;
  const re=awal?/[.!?…,;:]+["')\]]*(?=\s)|\n/g:/[.!?…]+["')\]]*(?=\s)|\n/g;let m,cut=-1;
  while((m=re.exec(sisa))){const end=m.index+m[0].length;if(end>=min){cut=end;break}}
  if(cut<0){if(akhir&&sisa.trim()){out.push(sisa);idx=full.length}return {out,idx}}
  out.push(sisa.slice(0,cut));idx+=cut;
 }
}

/* ---------- Perintah ganti suara lewat prompt ---------- */
const RE_PERINTAH=/\b(?:pakai|pake|gunakan|ganti|ubah|ganti\s+ke|ubah\s+ke|pindah\s+ke|jadi(?:kan)?)\s+(?:suara|voice)(?:nya)?\s*(?:ke|jadi|menjadi)?\s*(cowok|cowo|pria|laki[\s-]?laki|laki|cewek|cewe|wanita|perempuan)\b|\bsuara\s+(?:ai\s+)?(?:pakai|pake|jadi|ganti)\s+(cowok|cowo|pria|laki[\s-]?laki|laki|cewek|cewe|wanita|perempuan)\b/i;
function cekPerintahSuara(teks){
 const t=String(teks||'').trim();
 if(!t||t.length>70)return null;
 const m=t.match(RE_PERINTAH);if(!m)return null;
 const k=(m[1]||m[2]||'').toLowerCase();
 return /cowok|cowo|pria|laki/.test(k)?'cowok':'cewek';
}

 setText('','Silakan bicara…');
 try{fetch('https://generativelanguage.googleapis.com/',{mode:'no-cors'}).catch(()=>{})}catch(_){}
 kembaliDengar();
}
function tutupSuara(){
 V.open=false;V.sesi++;berhentiBicara();hentikanDengar();
 ov.classList.remove('open');setState('idle');window.AQIZ_SUARA_AKTIF=false;
}
btn.addEventListener('click',bukaSuara);
$v('vClose').addEventListener('click',tutupSuara);
$v('vEnd').addEventListener('click',tutupSuara);
ov.addEventListener('click',e=>{if(e.target===ov)tutupSuara()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&V.open)tutupSuara()});
$v('vMute').addEventListener('click',()=>{
 V.muted=!V.muted;
 if(V.muted){hentikanDengar();V.sesi++;if(V.state==='listening')setState('muted');else setState(V.state==='speaking'?'speaking':'muted',V.state==='speaking'?'Berbicara…':undefined)}
 else{if(V.state==='muted'||V.state==='idle'){setState('listening');mulaiDengar()}else setState(V.state)}
});
$v('vStop').addEventListener('click',()=>{berhentiBicara();if(V.open&&V.state==='speaking')kembaliDengar()});
$v('vOrb').addEventListener('click',()=>{
 if(V.state==='speaking'){berhentiBicara();V.muted=false;kembaliDengar();return}
 if(V.state==='thinking')return;
 if(V.muted)V.muted=false;
 setState('listening');mulaiDengar();
});
$v('vGender').addEventListener('click',e=>{const b=e.target.closest('button[data-g]');if(!b)return;setGender(b.dataset.g,true)});
$v('vRate').addEventListener('click',e=>{const b=e.target.closest('button[data-r]');if(!b)return;V.rate=+b.dataset.r;simpanSuara();renderSettings()});
window.addEventListener('pagehide',()=>{try{synth&&synth.cancel()}catch(_){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&V.open)tutupSuara()});

/* ---------- Bungkus kirimPesan: perintah suara lewat prompt teks juga ---------- */
window.kirimPesan=async function(teks){
 const g=cekPerintahSuara(teks);
 if(g&&!V.open){
  setGender(g,false);
  try{input.value='';ukurInput()}catch(_){}
  tip('Suara AI diganti ke '+g+'.');
  return;
 }
 return kirimAsli.apply(this,arguments);
};
renderSettings();
})();
